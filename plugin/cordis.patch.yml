# ESP32 小机器人 —— DSH bundle patch
#
# 1) esp32-robot：插件本体（宿主 index.js + 网页 client.js）
# 2) preset-esp32-robot：只给机器人自己那个会话用的 agent preset
#    - 人格变量 {{robot_persona}} 独占系统提示词，不带 DSH 的编程助手身份
#    - 只加载人格 / 时间 / 压缩三样；能力（工具）由插件按权限动态挂载
- insert:
    - id: esp32-robot
      name: dsh-esp32-robot
    - id: preset-esp32-robot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: esp32-robot
        name: ESP32 小机器人
        description: 桌面小机器人的大脑：人格 + 语音 + 表情 + 记忆，没有电脑操作能力
        order: 58
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{robot_persona}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
